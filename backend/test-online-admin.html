
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>LDC Online Admin Setup</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            font-family: Arial, sans-serif;

            background: #111;
            color: #fff;
        }

        .container {
            width: 100%;
            max-width: 450px;

            padding: 30px;

            background: #1c1c1c;

            border-radius: 14px;

            box-shadow:
                0 10px 40px rgba(0, 0, 0, 0.5);
        }

        h1 {
            margin-top: 0;

            color: #d4af37;

            text-align: center;
        }

        .subtitle {
            text-align: center;

            color: #aaa;

            margin-bottom: 25px;
        }

        label {
            display: block;

            margin-bottom: 7px;

            font-weight: bold;
        }

        input {
            width: 100%;

            padding: 13px;

            margin-bottom: 18px;

            border: 1px solid #444;

            border-radius: 8px;

            background: #111;

            color: #fff;

            font-size: 15px;

            outline: none;
        }

        input:focus {
            border-color: #d4af37;
        }

        button {
            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 8px;

            background: #d4af37;

            color: #111;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }

        button:disabled {
            opacity: 0.5;

            cursor: not-allowed;
        }

        #result {
            margin-top: 20px;

            padding: 14px;

            border-radius: 8px;

            display: none;

            white-space: pre-wrap;

            word-break: break-word;
        }

        .success {
            display: block !important;

            background: #12351f;

            border: 1px solid #287a43;

            color: #7ee2a8;
        }

        .error {
            display: block !important;

            background: #351212;

            border: 1px solid #7a2828;

            color: #ff8d8d;
        }

        .warning {
            margin-top: 20px;

            padding: 12px;

            border-radius: 8px;

            background: #30290f;

            border: 1px solid #655719;

            color: #d4af37;

            font-size: 13px;

            line-height: 1.5;
        }

    </style>

</head>


<body>


<div class="container">

    <h1>LDC Online Admin</h1>

    <div class="subtitle">
        Create the first Online Learning administrator
    </div>


    <form id="setupForm">


        <label for="name">
            Admin Name
        </label>

        <input
            type="text"
            id="name"
            placeholder="LDC Online Admin"
            required
        >


        <label for="email">
            Email
        </label>

        <input
            type="email"
            id="email"
            placeholder="admin@example.com"
            required
        >


        <label for="password">
            Password
        </label>

        <input
            type="password"
            id="password"
            placeholder="Enter a strong password"
            minlength="8"
            required
        >


        <button
            type="submit"
            id="submitButton"
        >
            Create Online Admin
        </button>


    </form>


    <div id="result"></div>


    <div class="warning">

        ⚠️ This page is only for initial setup.

        <br><br>

        After successfully creating the Online Admin,
        delete this HTML file.

    </div>


</div>


<script>

"use strict";


/* =========================================================
   CONFIGURATION
========================================================= */

const API_URL =
    "http://localhost:5000/api";


/* =========================================================
   ELEMENTS
========================================================= */

const setupForm =
    document.getElementById(
        "setupForm"
    );

const submitButton =
    document.getElementById(
        "submitButton"
    );

const result =
    document.getElementById(
        "result"
    );


/* =========================================================
   SHOW RESULT
========================================================= */

function showResult(
    message,
    type
) {

    result.textContent =
        message;

    result.className =
        type;

}


/* =========================================================
   ADMIN SETUP
========================================================= */

setupForm.addEventListener(
    "submit",
    async function (event) {

        event.preventDefault();


        const name =
            document
                .getElementById("name")
                .value
                .trim();


        const email =
            document
                .getElementById("email")
                .value
                .trim();


        const password =
            document
                .getElementById("password")
                .value;


        if (!name) {

            showResult(
                "Please enter the admin name.",
                "error"
            );

            return;
        }


        if (!email) {

            showResult(
                "Please enter the email.",
                "error"
            );

            return;
        }


        if (password.length < 8) {

            showResult(
                "Password must contain at least 8 characters.",
                "error"
            );

            return;
        }


        submitButton.disabled =
            true;

        submitButton.textContent =
            "Creating...";


        showResult(
            "Sending request to LDC backend...",
            "warning"
        );


        try {

            const response =
                await fetch(
                    `${API_URL}/online-admin/setup`,
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({

                            name:
                                name,

                            email:
                                email,

                            password:
                                password

                        })
                    }
                );


            const data =
                await response.json();


            console.log(
                "Online Admin Setup:",
                data
            );


            if (!response.ok) {

                showResult(
                    data.message ||
                    "Failed to create Online Admin.",
                    "error"
                );

                return;
            }


            showResult(
                "✅ Online Admin created successfully!\n\n" +
                "Name: " +
                (data.admin?.name || name) +
                "\n" +
                "Email: " +
                (data.admin?.email || email) +
                "\n\n" +
                "You can now log in through the Online Admin login.",
                "success"
            );


            setupForm.reset();


        } catch (error) {

            console.error(
                "Setup error:",
                error
            );


            showResult(
                "Could not connect to the LDC backend.\n\n" +
                "Make sure the backend is running with:\n" +
                "node server.js",
                "error"
            );


        } finally {

            submitButton.disabled =
                false;

            submitButton.textContent =
                "Create Online Admin";

        }

    }
);

</script>


</body>

</html>
